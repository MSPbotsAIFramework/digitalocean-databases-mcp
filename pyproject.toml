[project]
name = "digitalocean-databases-mcp"
version = "0.1.0"
description = "DigitalOcean Databases MCP server for the MSPbots Agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MSPbots.ai" }]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.scripts]
digitalocean-databases-mcp = "digitalocean_databases_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digitalocean_databases_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
